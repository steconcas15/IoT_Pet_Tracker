schemas:
  common_fields:
    _id: "str"
    type: "str"
    profile:
      rfid_tag: "str"
      wine_name: "str"
      wine_producer: "str"
      wine_description: "str"
      vintage: "int"
      optimal_temperature: "float"
    metadata:
      created_at: "datetime"
      updated_at: "datetime"
      status: "str"
  entity:
    data:
      measurements: "List[Dict]"

  validations:
    mandatory_fields:
      root:
        - _id
        - type
      profile:
        - wine_name
        - optimal_temperature
      metadata:
        - created_at
        - updated_at
        - status
    type_constraints:
      vintage:
        min: 1900
        max: 2024
      optimal_temperature:
        min: 4.0
        max: 20.0
      metadata.status:
        enum: ["stored", "sold", "removed"]
      measurements:
        item_constraints:
          required_fields:
            - timestamp
            - temperature
          type_mappings:
            timestamp: "datetime"
            temperature: "float"
    initialization:
      profile:
        rfid_tag: "None"
      metadata:
        status: "stored"
      measurements: []