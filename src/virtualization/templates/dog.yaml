schemas:
  common_fields:
    _id: str
    type: str
    profile:
      name: str        # Pet name
      species: str     # Pet species
    metadata:
      created_at: datetime    # Creation timestamp
      updated_at: datetime    # Last update timestamp
      
  entity:
    data:
      buzzer: str             # Buzzer identifier
      current_room: str       # ID current room
      buzzer_status: str      # Buzzer status (on/off)

  type_constraints:
      buzzer_status:
        type: str
        enum: ["off", "on"]
      
  validations:
    mandatory_fields:
      root:
        - _id
        - type
      profile:
        - name
        - species
      metadata:
        - created_at
        - updated_at

  initialization:
      buzzer: ""
      current_room: ""
      buzzer_status: "off"
