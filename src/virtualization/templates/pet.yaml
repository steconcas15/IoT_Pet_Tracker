schemas:
  common_fields:
    _id: str
    type: str
    profile:
      name: str        # Pet name
      species: str     # Pet species
    metadata:
      created_at: datetime    # Creation timestamp
      updated_at: datetime    # Last update timestamp
      
  entity:
    data:
      current_room: str
      buzzer_status: str
      last_buzzer_start_time: datetime       # <-- NUOVO CAMPO PER IL TIMER
      daily_buzzer_stats: List[Dict]

  validations:
    type_constraints:
      buzzer_status:
        type: str
        enum: ["ONLINE", "OFFLINE", "UNKNOWN"]
      last_buzzer_start_time:                # <-- NUOVO VINCOLO
        type: datetime
      daily_buzzer_stats:
        type: List[Dict]
        item_constraints:
          required_fields: [
            "date", 
            "auto_violations_count", 
            "auto_duration_mins"
          ]
          type_mappings:
            date: datetime
            auto_violations_count: int
            auto_duration_mins: float        # <-- CORRETTO DA "floats" A "float"
            
    initialization:
      data:
        current_room: ""
        buzzer_status: "UNKNOWN"
        last_buzzer_start_time: null         # <-- INIZIALIZZAZIONE VUOTA
        daily_buzzer_stats: []