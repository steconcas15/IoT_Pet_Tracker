schemas:
  common_fields:
    _id: str
    type: str
    profile:
      name: str
      species: str
    metadata:
      created_at: datetime
      updated_at: datetime
      
  entity:
    data:
      current_room: str
      buzzer_status: str
      last_buzzer_start_time: datetime
      daily_buzzer_stats: List[Dict]

  validations:
    type_constraints:
      buzzer_status:
        type: str
        enum: ["ONLINE", "OFFLINE", "UNKNOWN"]
      last_buzzer_start_time:
        type: datetime
      daily_buzzer_stats:
        type: List[Dict]
        item_constraints:
          required_fields: [
            "date", 
            "auto_violations_count", 
            "auto_duration_mins"
          ]
          type_mappings:
            date: datetime
            auto_violations_count: int
            auto_duration_mins: float
            
    initialization:
      data:
        current_room: ""
        buzzer_status: "UNKNOWN"
        last_buzzer_start_time: null
        daily_buzzer_stats: []