schemas:
  common_fields:
    _id: str
    type: str
    profile:
      name: str        # Room name
      description: str # Room description
      floor: int       # Floor number
    metadata:
      created_at: datetime    # Creation timestamp
      updated_at: datetime    # Last update timestamp
      permission_level: str   # Permission setting
      
  entity:
    data:
      status: str                   # Room occupancy status (empty/occupied)
      esp32cam_device: str          # Camera identifier
      ultrasonic_sensors: List[str] # List of ultrasonic sensor IDs in the room
      occupancy_stats: List[Dict]   # Historical daily occupancy statistics

  validations:
    mandatory_fields:
      root:
        - _id
        - type
      profile:
        - name
        - floor
      metadata:
        - created_at
        - updated_at
        - permission_level

    type_constraints:
      floor:
        type: int
        min: -1 # Allowing for basement floor
        max: 2  # 0 --> ground floor | 1 --> first floor | 2 --> loft
      permission_level:
        type: str
        enum: ["allowed", "forbidden"]
      status:
        type: str
        enum: ["empty", "occupied"]
      occupancy_stats:
        type: List[Dict]
        item_constraints:
          required_fields: ["date", "daily_stay_duration_mins", "dog_entries_count"]
          type_mappings:
            date: datetime
            daily_stay_duration_mins: float  # Residence time in minutes
            dog_entries_count: int           # Number of times the dog comes in

    initialization:
      status: "empty"
      esp32cam_device: ""
      ultrasonic_sensors: []
      metadata:
        permission_level: "allowed"
      occupancy_stats: []
      
