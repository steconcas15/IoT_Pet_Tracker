schemas:
  common_fields:
    _id: str
    type: str
    profile:
      name: str
      description: str
      floor: int
      permission_level: str   # <-- Spostato qui
    metadata:
      created_at: datetime
      updated_at: datetime
  entity:
    data:
      status: str
      occupancy_stats: List[Dict]

  validations:
    mandatory_fields:
      root:
        - _id
        - type
      profile:
        - name
        - floor
        - permission_level    # <-- Spostato qui
      metadata:
        - created_at
        - updated_at

    type_constraints:
      floor:
        type: int
        min: -1
        max: 2
      permission_level:
        type: str
        enum: ["allowed", "forbidden"]
      status:
        type: str
        enum: ["empty", "occupied"]
      occupancy_stats:
        type: List[Dict]
        item_constraints:
          required_fields: ["date", "daily_stay_duration_mins", "dog_entries_count"]
          type_mappings:
            date: datetime
            daily_stay_duration_mins: float
            dog_entries_count: int

    initialization:
      status: "empty"
      occupancy_stats: []
      profile:
        permission_level: "allowed" # <-- Inizializzazione adattata al profilo