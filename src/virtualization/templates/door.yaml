schemas:
  common_fields:
    _id: str
    type: str
    profile:
      name: str
      description: str
    metadata:
      created_at: datetime
      updated_at: datetime
  entity:
    data:
      sensor_status: str

  validations:
    mandatory_fields:
      root:
        - _id
        - type
      profile:
        - name
      metadata:
        - created_at
        - updated_at

    type_constraints:
      sensor_status:
        type: str
        enum: ["ONLINE", "OFFLINE", "UNKNOWN"]

    initialization:
      status: "active"
      profile:
        description: "Smart Door with Ultrasonic Sensor"
      data:
        sensor_status: "UNKNOWN"