schemas:
  common_fields:
    _id: str
    type: str
    profile:
      username: str
      password: str
    metadata:
      created_at: datetime
      updated_at: datetime
      otp_code: str
      otp_expires_at: datetime
      otp_verified: bool

  entity:
    data:
      owned_homes: List[str]
      viewable_homes: List[str]

  validations:
    mandatory_fields:
      root:
        - _id
        - type
      profile:
        - username
        - password
      metadata:
        - created_at
        - updated_at
        - otp_verified

    type_constraints:
      username:
        type: str
      password:
        type: str
      owned_homes:
        type: List[str]
      viewable_homes:
        type: List[str]
      otp_code:
        type: str
      otp_expires_at:
        type: datetime
      otp_verified:
        type: bool

    initialization:
      metadata:
        otp_verified: false
      owned_homes: []
      viewable_homes: []